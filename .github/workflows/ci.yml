name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows MSVC,      os: windows-2025, compiler: cl,       package: true,  flags: '' }
        - { name: Windows clang-cl,  os: windows-2025, compiler: clang-cl, package: true,  flags: '' }
        - { name: Windows MSVC ASan, os: windows-2025, compiler: cl,       package: false, flags: -DLIBWINUI_ENABLE_ASAN=ON -DLIBWINUI_BUILD_EXAMPLES=OFF }

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set Up MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      env:
        CXX_COMPILER: ${{ matrix.platform.compiler }}
        CMAKE_FLAGS: ${{ matrix.platform.flags }}
      run: cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -G "Ninja Multi-Config" "-DCMAKE_CXX_COMPILER=$CXX_COMPILER" -DLIBWINUI_ENABLE_PCH=ON -DLIBWINUI_ENABLE_UNITY_BUILD=ON $CMAKE_FLAGS

    # Two jobs: an MSVC gallery page needs several GB to compile.
    - name: Build
      run: cmake --build "$GITHUB_WORKSPACE/build" --config Debug --parallel 2

    # The pixel goldens are made on a development machine; the runner's Windows build draws text
    # with other font and DirectWrite versions. The semantic goldens and every other test run.
    - name: Test
      env:
        LIBWINUI_SKIP_PIXEL_GOLDENS: 1
      run: ctest --test-dir "$GITHUB_WORKSPACE/build" -C Debug --output-on-failure

    - name: Install
      if: matrix.platform.package
      run: cmake --install "$GITHUB_WORKSPACE/build" --config Debug --prefix "$RUNNER_TEMP/winui"

    # A project outside the tree that finds the installed package, builds an app and a UI test
    # against it, and runs the test.
    - name: Build Against the Installed Package
      if: matrix.platform.package
      env:
        CXX_COMPILER: ${{ matrix.platform.compiler }}
      run: |
        cmake -S "$GITHUB_WORKSPACE/tests/package" -B "$RUNNER_TEMP/package" -G "Ninja Multi-Config" "-DCMAKE_CXX_COMPILER=$CXX_COMPILER" "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/winui"
        cmake --build "$RUNNER_TEMP/package" --config Debug --parallel 2
        "$RUNNER_TEMP/package/Debug/package_headless.exe"

  checks:
    name: Format, API Surface and Docs
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows, os: windows-2025 }

    env:
      CLANG_FORMAT_VERSION: 22.1.8
      DOXYGEN_URL: https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.windows.x64.bin.zip
      DOXYGEN_SHA256: e84f54cfd49ef06b0b16536056dbec0c496323de28abcce53a4269463de35eaf

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set Up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Tools
      run: |
        python -m pip install "clang-format==$CLANG_FORMAT_VERSION"
        curl -sSfL -o "$RUNNER_TEMP/doxygen.zip" "$DOXYGEN_URL"
        echo "$DOXYGEN_SHA256  $RUNNER_TEMP/doxygen.zip" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/doxygen"
        unzip -q "$RUNNER_TEMP/doxygen.zip" -d "$RUNNER_TEMP/doxygen"
        echo "$RUNNER_TEMP/doxygen" >> "$GITHUB_PATH"

    - name: Check Formatting
      run: |
        git ls-files -- 'examples/*.hpp' 'examples/*.cpp' 'include/*.hpp' 'include/*.cpp' \
                        'src/*.hpp' 'src/*.cpp' 'tests/*.hpp' 'tests/*.cpp' 'tools/*.cpp' > "$RUNNER_TEMP/format-files.txt"
        clang-format --dry-run --Werror "--files=$RUNNER_TEMP/format-files.txt"

    - name: Set Up MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Only the tools (tools/), not the library. The gallery snippet check runs in the build jobs' ctest.
    - name: Build Tools
      run: |
        cmake -S "$GITHUB_WORKSPACE/tools" -B "$RUNNER_TEMP/tools" -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build "$RUNNER_TEMP/tools"

    # Doxygen creates only the last folder of its output path.
    - name: Run Doxygen
      run: |
        mkdir -p build/doxygen
        doxygen docs/tools/Doxyfile

    - name: Check API Surface
      run: '"$RUNNER_TEMP/tools/winui_api_surface" . --check'

    - name: Check API Reference
      run: python docs/tools/gen_reference.py --skip-doxygen --check
