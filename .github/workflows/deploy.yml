name: Deploy Docs

# Builds the documentation site with Zensical and uploads it to the Cloudflare Pages project
# "libwinui", served at https://libwinui.com. The API reference under docs/reference/ is
# generated and checked in (CI checks it is current), so this needs no Doxygen.

on:
  push:
    branches: [master]
    paths:
    - 'docs/**'
    - 'examples/**'
    - 'zensical.toml'
    - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      matrix:
        platform:
        - { name: Cloudflare Pages, os: ubuntu-26.04 }

    environment:
      name: production
      url: https://libwinui.com

    env:
      ZENSICAL_VERSION: 0.0.67

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set Up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Zensical
      run: python -m pip install "zensical==$ZENSICAL_VERSION"

    - name: Build Site
      run: zensical build

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy site --project-name=libwinui --branch=master
