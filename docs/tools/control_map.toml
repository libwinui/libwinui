# Which reference page each spec and control lands on (docs/tools/gen_reference.py).
#
# [[page]] entries produce docs/reference/<section>/<slug>.md showing the listed specs
# (fields in declaration order) and the control class (public API) on one page. Every
# other class, struct and concept gets a page of its own, named after it, under the section
# its header's directory maps to ([sections] below), and the namespace-scope functions, enums,
# aliases and constants of those headers one page per namespace. Headers named here are
# claimed and not repeated. A [[page]] with `related` but no `headers` bundles small types
# that would make poor pages on their own.
#
# Fields: section, slug, title,
# group (required in a [section_groups] section), specs (ui::* aggregates), control (the ui::*
# class), related (extra classes/structs shown on the same page), headers (claimed),
# tests (paths shown as "Tests"), example ("path:region" for a --8<-- snippet).

# Headers that belong to the themes section regardless of directory.
theme_headers = [
    "ui/themes/Theme.hpp", "ui/themes/ThemeSource.hpp", "ui/themes/Palette.hpp", "ui/themes/MetroPalette.hpp",
    "ui/themes/Mdl2Palette.hpp", "ui/themes/ClassicPalette.hpp", "ui/themes/EarlyPalette.hpp",
]

# Namespaces never documented.
hidden_namespaces = ["ui::detail"]

[sections]
# header directory -> reference section (for headers no [[page]] claims)
"core" = "core"
"render" = "rendering"
"ui" = "tree"
"testing" = "testing"

[section_groups]
# Sections whose nav and index are split into these groups, in this order; each of their
# [[page]] entries names one in `group`. Other sections list their [[page]] entries first and
# group the generated pages by kind: Classes, Structs, Concepts, Namespaces.
controls = ["Basic Input", "Text", "Collections", "Date and Time", "Navigation", "Menus and Toolbars", "Dialogs and Flyouts",
            "Status and Info", "Media and Icons", "Windowing and Hosting"]
layout = ["Panels", "Containers", "Scrolling and Gestures", "Panes and Splitters"]

[section_intros]
# A paragraph under a section index's title.
controls = "The Collections group holds the controls that take data. A view (`ListView`, `TileView`, `TreeView`, `TableView`) is given `.items` and an `.item` template and adds selection and scrolling, `ForEach` turns a collection into plain children, and the [item layouts](item-layouts.md) arrange them. Controls that arrange children you write yourself are under [Layout](../layout/index.md)."
layout = "Layout holds the controls that arrange children you write yourself: panels for several children, containers for one, scrolling, and panes. A control that builds its children from data is under [Collections](../controls/index.md#collections)."

[section_titles]
controls = "Controls"
layout = "Layout"
tree = "Tree and Window"
core = "Core"
rendering = "Rendering"
testing = "Testing"
themes = "Themes"

