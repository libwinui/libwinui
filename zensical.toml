# libwinui documentation site: https://zensical.org
# Build:   .venv/Scripts/zensical build      (or `cmake --build build --target docs`)
# Preview: .venv/Scripts/zensical serve     (http://localhost:8765, see dev_addr)
# The API reference under docs/reference/ is generated: python docs/tools/gen_reference.py

[project]
site_name = "libwinui"
site_description = "A native-like Windows UI library built with C++23 that you link statically and ship as one small .exe."
site_url = "https://libwinui.com/"
repo_url = "https://github.com/libwinui/libwinui"
repo_name = "libwinui/libwinui"
copyright = "Copyright &copy; 2026 libwinui contributors"
docs_dir = "docs"
site_dir = "site"
