[project.theme]
logo = "assets/logo-small.svg"     # the header; docs/assets/libwinui.ico is the favicon
favicon = "assets/libwinui.ico"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.footer",             # previous/next links, so the tutorials read as a course
  "navigation.tracking",           # the URL follows the heading in view, for linkable sections
  "navigation.prune",              # render only the open nav subtree; the reference nav is large
  # Instant loading fetches pages without a full reload. It needs site_url above.
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "toc.follow",                    # the page outline scrolls to the section being read
  "search.highlight",
  "search.suggest",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",             # picking a content tab picks the same tab everywhere
  "content.tooltips",
  "content.footnote.tooltips",
]

# System preference first, then an explicit light and dark; the header toggle cycles them.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false               # no "Made with Zensical" in the footer

# Social cards: one preview image per page, for links shared on social media and in chats.
[project.plugins.social]
# The layout takes its colors from a palette primary, which this site does not set.
cards_layout_options = { background_color = "#202020", color = "#FFFFFF" }

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/libwinui/libwinui"
name = "libwinui on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/libwinui.bsky.social"
name = "libwinui on Bluesky"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/libwinui"
name = "libwinui on Twitter"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
abbr = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"          # content.code.select needs the line spans
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tasklist.custom_checkbox = true
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true          # a region cut from inside main() starts at column 0
